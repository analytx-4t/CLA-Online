<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CLA Dashboard</title>
  <link rel="stylesheet" href="../CSS/dashboard.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="../assets/logo.png" alt="CLA Logo" class="logo">
        <div class="brand-text">CLA Online</div>
      </div>
      <nav class="nav">
        <ul>
          <li class="active"><a href="dashboard.html">Dashboard</a></li>
          <li><a href="chatbot_interface.html">Chatbot</a></li>
        </ul>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="hamburger" class="hamburger">☰</button>
          <div class="search"><input placeholder="Search for case laws, acts, circulars, articles and more..."></div>
        </div>
        <div class="header-actions">
          <button id="themeToggle2" class="icon-btn theme-toggle">🌙<span>Dark</span></button>
          <button class="icon-btn">🔔</button>
          <button class="icon-btn">⎋</button>
          <div class="profile">JD</div>
        </div>
      </header>

      <section class="content dashboard-content">
        <h1>Welcome to CLA Online</h1>
        <p>Your corporate legal assistant dashboard.</p>

        <div class="cards">
          <div class="card">Recent chats</div>
          <div class="card">Saved library</div>
          <div class="card">Settings</div>
        </div>
      </section>
    </div>
  </div>

  <script src="../javascript/dashboard.js"></script>
</body>
</html>
